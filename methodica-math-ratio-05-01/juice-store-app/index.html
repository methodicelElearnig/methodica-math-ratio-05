<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יישומון יחס — סידור בקבוקים במכולת</title>
<style>
  @font-face {
    font-family: 'Assistant';
    src: url('../assets/fonts/assistant-hebrew.woff2') format('woff2');
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
  }
  @font-face {
    font-family: 'Assistant';
    src: url('../assets/fonts/assistant-latin.woff2') format('woff2');
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Assistant', sans-serif;
    background: transparent;
    overflow: hidden;
  }

  /* ⚠️ נבנה-מחדש (07.09.2026, לפי בקשה מפורשת + תמונת-רפרנס שסופקה
     חוזרת) — הגרסה הקודמת הייתה מדף מצויר-CSS טהור + 3 עיגולי-ספירה
     פשוטים, בלי כרטיס-הנחיות. הפעם: המדף האמיתי מגיליון-הנכסים המקורי
     (images.png, נחתך/הוסר-רקע ב-Pillow/NumPy, אותה טכניקה כמו בקבוקים/
     ארגזים), כרטיס-הנחיות, וכרטיס-ספירה עשיר עם אייקונים — כל אלה
     מהתמונה-הממחישה. הפריסה עצמה (עמודה-אחת-מעל-השנייה, לא 3 טורים
     רחבים כמו ברפרנס) הותאמה לקונטיינר הריבועי-בקירוב בפועל (~460×460,
     .s6-applet-frame ב-index.html הראשי) — רפרנס עצמו רחב-מדי לא-יתאים
     שם בלי לשנות את גודל-האייפריים (לא התבקש). */
  .juice-app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 380px;
    background: #F7F5FF;
    border: 1px solid #CEC7FF;
    border-radius: 12px;
    overflow: hidden;
    padding: 10px;
    gap: 8px;
  }

  /* כרטיס-הנחיות — לבן/קרם, פינות מעוגלות, לפי התמונה-הממחישה. */
  /* ⚠️ תוקן (07.09.2026, לפי בקשה מפורשת: "טקסט ההנחיות ליישומון, צריך
     להיות בגודל 20") — כותרת ו-li היו 13px/11.5px, עלו ל-20px. */
  .juice-app__instructions {
    flex-shrink: 0;
    background: #FFFDF3;
    border: 1px solid #F0E6B8;
    border-radius: 10px;
    padding: 8px 10px;
  }
  .juice-app__instructions-title {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 800;
    color: #2F2478;
  }
  .juice-app__instructions ol {
    margin: 0;
    padding-inline-start: 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .juice-app__instructions li {
    font-size: 20px;
    line-height: 1.35;
    color: #3A3A3A;
  }

  .juice-app__body {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 10px;
  }

  /* --- עמודת המדף (התמונה האמיתית, לא CSS) ---
     ⚠️ פוצל (10.09.2026, דיווח: "כף היד של הסקרול נראית חתוכה") —
     .juice-app__shelf-col עצמו כבר לא clipping-container: היה
     overflow:hidden ישירות עליו, אז רמז-היד/הטבעות (.juice-app__scroll-gesture,
     ילד ישיר, position:absolute;inset:0) נחתכו על-ידי אותו overflow
     בכל פעם שהם חייבים לחרוג מעט מגבול-הכרטיס כדי "לגעת" בפועל בפס-
     הגלילה הצמוד לקצה. ה-clipping (border/background/radius/overflow)
     עבר ל-.juice-app__shelf-visual (עטיפה פנימית חדשה, מכילה רק את
     המדף עצמו) — .juice-app__shelf-col הפך ל-position:relative גרידא,
     בלי overflow, כדי שרמז-היד (אחיו של shelf-visual, לא ילד שלו)
     יוכל לצייר מעט מעבר לגבול-הכרטיס בלי להיחתך. */
  .juice-app__shelf-col {
    position: relative; /* עוגן ל-.juice-app__scroll-gesture (עטיפת רמז-היד) למטה */
    flex: 1.3;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .juice-app__shelf-visual {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    border: 1px solid #E5E1F5;
    border-radius: 10px;
    overflow: hidden;
  }
  /* ⚠️ תוקן (07.09.2026, דיווח: "למה למדף העליון לא מתאפשרת הוספת
     בקבוקים??") — .shelf-cap הוא <img> דקורטיבי-בלבד (הכיסוי/מסגרת
     העליונה של יחידת-המדף, מ-shelf-top.png), יושב מחוץ ל-#shelvesWrap
     ולכן אינו .shelf-row בכלל — אין שם שום היגיון-גרירה. בגודל height:auto
     המקורי (יחס-רוחב-גובה טבעי, ~448:104) הוא תפס נתח גדול-מדי מהגובה
     ונראה בדיוק כמו תא-מדף ריק נוסף (אותו טקסטורת-קיר כחולה) — הלומד/ת
     ניסו לגרור לשם בקבוק וזה לא עבד. צומצם לרצועה דקורטיבית דקה
     (18px, object-fit:cover חותך לפס-המסגרת העליון בלבד, לא לקיר
     הריק שמתחתיו) כדי שלא ייראה כמו מדף פונקציונלי. */
  .shelf-cap {
    flex-shrink: 0;
    width: 100%;
    height: 18px;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  /* ⚠️ עודכן (10.09.2026, לפי בקשה מפורשת: "הסקרולבר... שיהיה בצד
     הימני של המדפים") — היה בלי override, אז בירושת dir="rtl" מה-html
     (למעלה) הדפדפן שם את פס-הגלילה בצד שמאל כברירת-מחדל. direction:ltr
     כאן (רק לצורך מיקום-פס-הגלילה, אותה מוסכמה בדיוק כמו
     .s4-notebook-scroll/.oly-scroll-area בקובץ הראשי) + direction:rtl
     על #shelvesContainer (ב-HTML) שמחזיר RTL לתוכן-בפועל בתוכו. גם
     הוגדל ל-12px וצבוע בסגול-הנושא (במקום 8px אפור-כמעט-שקוף) כדי
     שיבלוט יותר. */
  .juice-app__shelves-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    touch-action: pan-y;
    direction: ltr;
  }
  #shelvesContainer { direction: rtl; }
  .juice-app__shelves-wrap::-webkit-scrollbar { width: 12px; }
  .juice-app__shelves-wrap::-webkit-scrollbar-track { background: rgba(201, 206, 216, 0.4); border-radius: 16px; }
  .juice-app__shelves-wrap::-webkit-scrollbar-thumb { background: #3B2FC2; border-radius: 24px; }

  /* ⚠️ נוסף (10.09.2026, לפי בקשה מפורשת: "שיופיע הרמז אפקט היד שישים
     לב הלומד שהתווסף סקרולבר") — אותו רכיב-רמז-גלילה (יד + שתי-טבעות-
     פועמות) הקיים במסך הראשי (styles.css § Gesture Hint — Cursor
     Scroll), משוכפל כאן במלואו (iframe נפרד, מסמך HTML עצמאי משלו —
     לא ניתן לשתף CSS בין המסמכים). מוצג/מוסתר ב-JS
     (maybeShowScrollGesture, למטה) — אותו דפוס show-once-אם-יש-מה-
     לגלול כמו s1/s2/s6MaybeShowScrollGesture בקובץ הראשי. */
  .juice-app__scroll-gesture {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  .juice-app__scroll-gesture[hidden] { display: none; }
  .juice-app__scroll-gesture .gesture-hint {
    position: absolute;
    /* ⚠️ עודכן (10.09.2026, לפי בקשה מפורשת: "היד צריכה להיות בדיוק
       ממוקמת על הסקרולבר עצמו") — נמדד בפועל (getBoundingClientRect):
       פס-הגלילה (12px) יושב צמוד לקצה-הימני של .juice-app__shelves-wrap,
       וזה עצמו צמוד (border 1px) לקצה של .juice-app__shelf-col (הבסיס
       ל-inset:0 של העטיפה הזו) — כך שמרכז-הפס הוא בדיוק
       1+12/2=7px מהקצה. אותו חישוב תקף גם במצב-רגיל וגם במצב-מוגדל
       (הפס עצמו לא גדל), אז אין יותר צורך ב-override נפרד ב-media
       query למטה. */
    left: auto; right: 7px; top: 62%;
    translate: -50% -50%;
    width: 0; height: 0;
    pointer-events: none;
  }
  .juice-app__scroll-gesture .gesture-hint-hand,
  .juice-app__scroll-gesture .gesture-hint-ring {
    position: absolute;
    left: 0; top: 0;
    translate: -50% -50%;
  }
  /* ⚠️ עודכן (10.09.2026, דיווח: "כף היד של הסקרול נראית חתוכה") —
     היה hand:22×26 / ring-small:10 / ring-big:50, אבל העוגן (right:7px,
     ר' .gesture-hint למעלה) יושב ~7px מקצה .juice-app__shelf-col, ובין
     שם ל-overflow:hidden הבא בשרשרת (.juice-app החיצוני, padding:10px)
     יש רק ~17px רווח פנוי — טבעת-50px (רדיוס 25) חרגה הרחק מעבר לזה
     ונחתכה. הוקטן לגדלים שבאמת נכנסים בלי חיתוך בתוך ה-~17px הזמינים
     (זהה במצב-רגיל ומצב-מוגדל כאחד — הרווח הזה קבוע בפיקסלים, לא תלוי
     בגודל-היישומון הכולל, ולכן אין יותר override נפרד ב-media query
     למטה). */
  .juice-app__scroll-gesture .gesture-hint-hand { width: 16px; height: 19px; z-index: 3; }
  .juice-app__scroll-gesture .gesture-hint-ring { border-radius: 50%; opacity: 0; }
  .juice-app__scroll-gesture .gesture-hint-ring--small {
    width: 7px; height: 7px;
    border: 1.5px solid #B3B0FF;
    z-index: 2;
    animation: juice-gesture-ring-small 2s infinite;
  }
  .juice-app__scroll-gesture .gesture-hint-ring--big {
    width: 26px; height: 26px;
    background: #B3B0FF;
    border: 2px solid #BDB3FC;
    z-index: 1;
    animation: juice-gesture-ring-big 2s infinite;
  }
  @keyframes juice-gesture-ring-small {
    0%   { opacity: 0;    scale: 0.2 0.2; }
    3%   { opacity: 0.75; scale: 1   1; }
    10%  { opacity: 0;    scale: 1.1 1.1; }
    100% { opacity: 0;    scale: 1.1 1.1; }
  }
  @keyframes juice-gesture-ring-big {
    0%    { opacity: 0;    scale: 0.05 0.05; }
    5%    { opacity: 0.85; }
    7.5%  {                scale: 0.22 0.22; }
    22.5% {                scale: 0.6  0.6; }
    35%   { opacity: 0.65; }
    37.5% {                scale: 0.85 0.85; }
    45%   { opacity: 0.35; }
    50%   { opacity: 0;    scale: 1 1; }
    100%  { opacity: 0;    scale: 1 1; }
  }

  /* כל שורה = אריח-מדף אמיתי אחד (shelf-tile.png) כרקע — לא עוד .shelf-plank
     מצויר. הקרש נמצא בקצה-התחתון של האריח (ראו הערת-חיתוך בפייתון);
     .shelf-items מיושר ל-bottom כדי שהבקבוקים "יעמדו" עליו. */
  .shelf-row {
    position: relative;
    width: 100%;
    aspect-ratio: 448 / 81; /* ⚠️ עודכן (10.09.2026, לפי בקשה מפורשת: "להקטין קצת את
      הגובה של המדף, כדי שיכנסו יותר מדפים") — היה 448/95 (יחס-הרוחב-
      גובה הטבעי של shelf-tile.png ללא עיוות). כל מדף נמוך ב-~15%, כך
      שנכנסים יותר מדפים בבת-אחת לפני שצריך לגלול; background-size:100%
      100% כבר מותח את התמונה למידות-הריבוע בפועל, אז הכיווץ-האנכי
      הקל בטקסטורת-העץ לא אמור להיות בולט. */
    background-image: url('shelf-tile.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }
  /* ⚠️ 26% = בדיוק קצה-העליון של הקרש בתוך האריח (מדידה בפייתון בזמן
     החיתוך: הקרש תופס את ה-26.3% התחתונים של shelf-tile.png) — הבקבוקים
     "עומדים" בדיוק על פני הקרש, לא שוקעים לתוכו. */
  /* ⚠️ תוקן (07.09.2026, דיווח: "אפשר להכניס יותר בקבוקים במדף? הם
     נראים די רחוקים אחד מהשני") — קיבולת-המדף (5, קבוע ל-.shelf-row
     אחד = קבוצת-יחס אחת של 2:3, אושר מפורשות קודם) לא שונתה; זה תיקון
     חזותי-בלבד: gap 5%→1.5% ורוחב-בקבוק 15%→18%, כך שחמשת הבקבוקים
     ממלאים את המדף בצפיפות במקום "לצוף" מרווחים. */
  .shelf-items {
    position: absolute;
    bottom: 26%;
    left: 0;
    right: 0;
    height: 68%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 1.5%;
  }

  .shelf-bottle {
    width: 18%;
    height: 100%;
    object-fit: contain;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .shelf-bottle:active { cursor: grabbing; }
  .shelf-bottle.is-dragging-source { visibility: hidden; }

  .drag-ghost {
    position: fixed;
    width: 26px;
    height: 74px;
    object-fit: contain;
    pointer-events: none;
    z-index: 999;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
    transform: translate(-50%, -50%);
  }

  /* --- עמודה ימנית: ארגזים + כרטיס-ספירה --- */
  .juice-app__side-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .juice-app__crates {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
  }
  .crate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: grab;
    user-select: none;
    touch-action: none;
    flex: 1;
    min-width: 0;
  }
  .crate img { width: 100%; max-width: 84px; height: auto; display: block; pointer-events: none; }
  .crate:active { cursor: grabbing; }

  /* כרטיס-ספירה — כחול-בהיר, פינות מעוגלות, שורה לכל מדד + אייקון,
     לפי התמונה-הממחישה ("ספירה:").
     ⚠️ עודכן (10.09.2026, דיווח: "המלבן התחתון הזה אפשר להקטין, הוא
     דיי גדול סתם וריק") — flex:1 מתח את הכרטיס למלוא-הגובה-הפנוי
     בעמודה (445px במסך המוגדל!), בעוד התוכן האמיתי (כותרת+4 שורות)
     צריך רק ~172px — 177px של שטח ריק בתוך הכרטיס. flex-shrink:0
     (גובה לפי-תוכן, לא עוד "תופס-כל-השאר") מתקן את זה. */
  .juice-app__stats {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: #F0F4FF;
    border: 1px solid #CEC7FF;
    border-radius: 10px;
    padding: 8px 10px;
    gap: 5px;
    overflow-y: auto;
  }
  /* ⚠️ עודכן (10.09.2026, לפי בקשה מפורשת: "תגדיל טיפה את הטקסט הזה,
     בקושי קוראים אותו, אבל אל תשנה לו את המיקום") — 22px (שנוסה בסבב
     קודם) גרם לתוויות הארוכות להישבר ל-2 שורות בעמודה הצרה הזו
     (~200px) ולחתוך חלק מהכרטיס; הפעם המיקום נשאר בעמודה הצרה כמבוקש,
     אז הגודל עלה בעדינות (12.5→15 / 11.5→14) — נבדק בפועל שזה עדיין
     נכנס בשורה אחת בלי להישבר. */
  .juice-app__stats-title {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 800;
    color: #2F2478;
  }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 700;
    color: #2F2478;
  }
  .stat-row img { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
  .stat-icon-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .stat-icon-dot--total { background: linear-gradient(90deg, #D0312D 50%, #F5A623 50%); }
  .stat-icon-dot--remaining { background: #9C97C7; }
  .stat-row .stat-label { flex: 1; min-width: 0; }
  .stat-row .stat-val { font-weight: 800; flex-shrink: 0; }

  .juice-app__actions {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
  }
  .juice-app__action-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    border-radius: 999px;
    border: none;
    font-family: 'Assistant', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .juice-app__action-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .juice-app__action-btn--reset {
    background: #3B2FC2;
    color: #fff;
  }
  .juice-app__action-btn--reset:hover { background: #2F2478; }
  .juice-app__action-btn:focus-visible { outline: 2px solid #3B2FC2; outline-offset: 2px; }

  /* ⚠️ נוסף (10.09.2026, לפי בקשה מפורשת: "הטקסט המסומן צריך להיות
     יותר גדול במסך הגדול של הגדלת היישומון") — ה-iframe הזה מסמך-נפרד
     לגמרי, אז אין לו דרך ישירה לדעת שהאב (.s6-applet-wrap) במצב
     is-expanded — אבל הוא כן "יודע" את גודל-עצמו: ברירת-מחדל 460×460
     בפועל, ~1200×640 כשמורחב (94%×90% מקנבס 1280×710, ר' styles.css §
     .s6-applet-wrap.is-expanded). media query לפי רוחב-חלון עצמו (לא
     תלוי-JS/postMessage) הוא הכלי הנכון כאן. רמז-הגלילה (יד/טבעות)
     נשאר אחיד בין שני המצבים (ר' ההערה ליד .gesture-hint-hand למעלה —
     תלוי ברווח-פנוי קבוע בפיקסלים, לא בגודל-היישומון), רק טקסט-הספירה
     גדל כאן. */
  @media (min-width: 700px) {
    /* ⚠️ עודכן (10.09.2026, לפי בקשה מפורשת: "הטקסט המסומן צריך להיות
       בגודל 20") — היה 28px ואז 22px (ניסיונות קודמים); לפי הסימון
       בצילום-המסך האחרון, זה חל על שורות-התווית (.stat-row), לא על
       כותרת "ספירה:" (לא סומנה) — נשארה 22px. */
    .juice-app__stats-title { font-size: 20px; }
    .stat-row { font-size: 20px; gap: 10px; }
    .stat-row img { width: 24px; height: 24px; }
    .stat-icon-dot { width: 18px; height: 18px; }
    /* ⚠️ נוסף (10.09.2026, לפי בקשה מפורשת: "צריך שקופסאות הבקבוקים
       יהיו יותר גדולות") — .crate img היה max-width:84px קבוע (לא
       תלוי-אחוזים), אז במסך המוגדל (~1200px, בערך פי-2.6 מהרגיל)
       הארגזים נשארו באותו גודל-פיקסלים בדיוק כמו הכרטיסים/מדף/טקסט
       שכן גדלו — נראו זעירים יחסית. הוגדלו כאן ל-160px, יש בהחלט מקום
       (ר' הערה ליד .juice-app__stats — flex:1 הוסר משם, פינה עוד המון
       גובה-פנוי בעמודה). */
    .crate img { max-width: 160px; }
  }
</style>
</head>
<body>
  <div class="juice-app">
    <div class="juice-app__instructions">
      <p class="juice-app__instructions-title">הנחיות:</p>
      <ol>
        <li>גררו בקבוקי שתייה אל המדפים.</li>
        <li>בכל מדף סדרו קבוצה אחת של היחס: 2 בקבוקי תות ו-3 בקבוקי מנגו.</li>
        <li>המשיכו עד שתסדרו את כל 60 הבקבוקים.</li>
      </ol>
    </div>

    <div class="juice-app__body">
      <div class="juice-app__shelf-col">
        <div class="juice-app__shelf-visual">
          <img class="shelf-cap" src="shelf-top.png" alt="" aria-hidden="true">
          <div class="juice-app__shelves-wrap" id="shelvesWrap">
            <div id="shelvesContainer"></div>
          </div>
        </div>
        <div class="juice-app__scroll-gesture" id="scrollGesture" hidden>
          <div class="gesture-hint">
            <div class="gesture-hint-ring gesture-hint-ring--big"></div>
            <div class="gesture-hint-ring gesture-hint-ring--small"></div>
            <img class="gesture-hint-hand" src="../assets/images/gesture-hand-cursor.svg" alt="">
          </div>
        </div>
      </div>

      <div class="juice-app__side-col">
        <div class="juice-app__crates">
          <div class="crate" id="crateStrawberry" data-flavor="strawberry">
            <img src="crate-strawberry.png" alt="ארגז בקבוקי תות" draggable="false">
          </div>
          <div class="crate" id="crateMango" data-flavor="mango">
            <img src="crate-mango.png" alt="ארגז בקבוקי מנגו" draggable="false">
          </div>
        </div>

        <div class="juice-app__stats" aria-live="polite">
          <p class="juice-app__stats-title">ספירה:</p>
          <div class="stat-row">
            <img src="bottle-strawberry.png" alt="">
            <span class="stat-label">בקבוקי תות שנגררו:</span>
            <span class="stat-val" id="countStrawberry">0</span>
          </div>
          <div class="stat-row">
            <img src="bottle-mango.png" alt="">
            <span class="stat-label">בקבוקי מנגו שנגררו:</span>
            <span class="stat-val" id="countMango">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-icon-dot stat-icon-dot--total" aria-hidden="true"></span>
            <span class="stat-label">סה"כ נגררו:</span>
            <span class="stat-val" id="countTotal">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-icon-dot stat-icon-dot--remaining" aria-hidden="true"></span>
            <span class="stat-label">נשארו לסידור:</span>
            <span class="stat-val" id="countRemaining">60</span>
          </div>
        </div>
      </div>
    </div>

    <div class="juice-app__actions">
      <!-- ⚠️ תוקן (07.09.2026, דיווח: "למה יש שני כפתורים ששניהם עושים
           איפוס, הייתי מורידה את 'נקה מדפים' כדי לפנות מקום למדפים")
           — הוסר כפתור "נקה את המדפים" (היה מפעיל בדיוק את אותה
           פונקציית-איפוס-מלאה (clearAll) כמו "איפוס", ללא הבדל-בפועל
           — תועד קודם כפישוט-מכוון, ראו ARCHITECTURE.md; עכשיו הוסר
           לגמרי לפי בקשה מפורשת, לא רק תועד). נשאר כפתור "איפוס" יחיד. -->
      <button type="button" class="juice-app__action-btn juice-app__action-btn--reset" id="resetBtn" aria-label="איפוס ליישומון">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        איפוס
      </button>
    </div>
  </div>

<script>
(function () {
  var BUDGET = 60;
  var SHELF_CAPACITY = 5;
  var BOTTLE_SRC = { mango: 'bottle-mango.png', strawberry: 'bottle-strawberry.png' };
  var BOTTLE_ALT = { mango: 'בקבוק מנגו', strawberry: 'בקבוק תות' };

  var shelves = [[]]; // array of rows; each row is array of {flavor}

  var shelvesContainer = document.getElementById('shelvesContainer');
  var shelvesWrap = document.getElementById('shelvesWrap');
  var scrollGestureEl = document.getElementById('scrollGesture');
  var scrollGestureShown = false;
  var countMangoEl = document.getElementById('countMango');
  var countStrawberryEl = document.getElementById('countStrawberry');
  var countTotalEl = document.getElementById('countTotal');
  var countRemainingEl = document.getElementById('countRemaining');
  var crateMango = document.getElementById('crateMango');
  var crateStrawberry = document.getElementById('crateStrawberry');
  var resetBtn = document.getElementById('resetBtn');

  var dragState = null; // {flavor, fromRow, fromIndex, el, ghost, pointerId}

  function totalDragged() {
    var total = 0;
    for (var i = 0; i < shelves.length; i++) total += shelves[i].length;
    return total;
  }

  function updateCounts() {
    var mango = 0, strawberry = 0;
    for (var i = 0; i < shelves.length; i++) {
      for (var j = 0; j < shelves[i].length; j++) {
        if (shelves[i][j].flavor === 'mango') mango++;
        else strawberry++;
      }
    }
    countMangoEl.textContent = String(mango);
    countStrawberryEl.textContent = String(strawberry);
    countTotalEl.textContent = String(mango + strawberry);
    countRemainingEl.textContent = String(BUDGET - mango - strawberry);
  }

  /* ⚠️ נוסף (10.09.2026, לפי בקשה מפורשת) — אותו דפוס show-once-אם-יש-
     מה-לגלול כמו s1/s2/s6MaybeShowScrollGesture בקובץ הראשי (script.js):
     מוצג פעם אחת בלבד, ורק כש-scrollHeight>clientHeight בפועל (כלומר
     ברגע שנוסף מדף שגורם לגלילה אמיתית — לא בהכרח מהעמסה הראשונה),
     ומוסתר לצמיתות ברגע שהלומד/ת גולל/ת בפועל בפעם הראשונה. נקרא
     מ-render() (למטה) בכל פעם שהמדפים מצטיירים-מחדש, לא רק פעם אחת. */
  function maybeShowScrollGesture() {
    requestAnimationFrame(function () {
      if (scrollGestureShown || !scrollGestureEl || !shelvesWrap) return;
      if (shelvesWrap.scrollHeight <= shelvesWrap.clientHeight) return;
      scrollGestureShown = true;
      scrollGestureEl.hidden = false;
      shelvesWrap.addEventListener('scroll', hideScrollGesture, { once: true });
    });
  }
  function hideScrollGesture() {
    if (scrollGestureEl) scrollGestureEl.hidden = true;
  }

  function rebalanceShelves() {
    while (shelves.length > 1 &&
           shelves[shelves.length - 1].length === 0 &&
           shelves[shelves.length - 2].length === 0) {
      shelves.pop();
    }
    if (shelves[shelves.length - 1].length >= SHELF_CAPACITY) {
      shelves.push([]);
    }
  }

  function render() {
    shelvesContainer.innerHTML = '';
    var frag = document.createDocumentFragment();
    for (var r = 0; r < shelves.length; r++) {
      var row = document.createElement('div');
      row.className = 'shelf-row';
      row.dataset.rowIndex = String(r);

      var items = document.createElement('div');
      items.className = 'shelf-items';
      for (var i = 0; i < shelves[r].length; i++) {
        var item = shelves[r][i];
        var img = document.createElement('img');
        img.className = 'shelf-bottle';
        img.src = BOTTLE_SRC[item.flavor];
        img.alt = BOTTLE_ALT[item.flavor];
        img.draggable = false;
        img.dataset.rowIndex = String(r);
        img.dataset.itemIndex = String(i);
        img.dataset.flavor = item.flavor;
        attachBottleDrag(img);
        items.appendChild(img);
      }
      row.appendChild(items);

      frag.appendChild(row);
    }
    shelvesContainer.appendChild(frag);
    updateCounts();
    maybeShowScrollGesture();
  }

  function rowEffectiveCapacityOk(rowEl, excludeSameRow) {
    if (!rowEl) return false;
    var rowIndex = parseInt(rowEl.dataset.rowIndex, 10);
    var count = shelves[rowIndex].length;
    if (excludeSameRow && dragState && dragState.fromRow === rowIndex) count -= 1;
    return count < SHELF_CAPACITY ? rowIndex : -1;
  }

  function createGhost(flavor, x, y) {
    var ghost = document.createElement('img');
    ghost.className = 'drag-ghost';
    ghost.src = BOTTLE_SRC[flavor];
    ghost.alt = '';
    ghost.style.left = x + 'px';
    ghost.style.top = y + 'px';
    document.body.appendChild(ghost);
    return ghost;
  }

  function moveGhost(x, y) {
    if (dragState && dragState.ghost) {
      dragState.ghost.style.left = x + 'px';
      dragState.ghost.style.top = y + 'px';
    }
  }

  function endDrag(clientX, clientY) {
    if (!dragState) return;
    if (dragState.ghost) dragState.ghost.style.display = 'none';
    var targetEl = document.elementFromPoint(clientX, clientY);
    if (dragState.ghost) dragState.ghost.remove();

    var handled = false;

    if (targetEl) {
      var shelfRow = targetEl.closest('.shelf-row');
      if (shelfRow) {
        var destRowIndex = rowEffectiveCapacityOk(shelfRow, true);
        if (destRowIndex >= 0) {
          if (dragState.fromRow !== null) {
            shelves[dragState.fromRow].splice(dragState.fromIndex, 1);
          }
          shelves[destRowIndex].push({ flavor: dragState.flavor });
          handled = true;
        }
      } else {
        var crateEl = targetEl.closest('.crate');
        if (crateEl && dragState.fromRow !== null && crateEl.dataset.flavor === dragState.flavor) {
          shelves[dragState.fromRow].splice(dragState.fromIndex, 1);
          handled = true;
        }
      }
    }

    if (!handled && dragState.sourceBottleEl) {
      dragState.sourceBottleEl.classList.remove('is-dragging-source');
    }

    rebalanceShelves();
    render();
    dragState = null;
  }

  function onPointerMove(e) {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    moveGhost(e.clientX, e.clientY);
  }

  function onPointerUp(e) {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);
    endDrag(e.clientX, e.clientY);
  }

  function startDrag(flavor, pointerId, x, y, sourceBottleEl, fromRow, fromIndex) {
    if (dragState) return;
    dragState = {
      flavor: flavor,
      pointerId: pointerId,
      fromRow: fromRow === undefined ? null : fromRow,
      fromIndex: fromIndex === undefined ? null : fromIndex,
      sourceBottleEl: sourceBottleEl || null,
      ghost: createGhost(flavor, x, y)
    };
    if (sourceBottleEl) sourceBottleEl.classList.add('is-dragging-source');
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
  }

  function attachCrateDrag(crateEl, flavor) {
    crateEl.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (BUDGET - totalDragged() <= 0) return;
      startDrag(flavor, e.pointerId, e.clientX, e.clientY, null, null, null);
    });
  }

  function attachBottleDrag(img) {
    img.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var rowIndex = parseInt(img.dataset.rowIndex, 10);
      var itemIndex = parseInt(img.dataset.itemIndex, 10);
      startDrag(img.dataset.flavor, e.pointerId, e.clientX, e.clientY, img, rowIndex, itemIndex);
    });
  }

  function clearAll() {
    shelves = [[]];
    render();
  }

  attachCrateDrag(crateMango, 'mango');
  attachCrateDrag(crateStrawberry, 'strawberry');
  resetBtn.addEventListener('click', clearAll);

  render();
})();
</script>
</body>
</html>
